<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TVU Facility Incident Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TVU Facility">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TVU Facility - Báo Cáo Sự Cố</title>
  <link rel="manifest" href="manifest.json">
  <!-- ZXing library for Web Barcode / QR Scanning -->
  <script defer src="https://unpkg.com/@zxing/library@0.19.1" type="application/javascript"></script>
</head>
<body style="margin: 0; background-color: #0D47A1;">
  <!-- Màn hình chờ tải ứng dụng khi mở trên điện thoại & máy tính -->
  <div id="loading-indicator" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0D47A1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; z-index: 999999;">
    <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.25); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.9s linear infinite;"></div>
    <h2 style="margin-top: 22px; font-size: 22px; font-weight: 700; letter-spacing: 2px;">TVU FACILITY</h2>
    <p style="margin-top: 6px; font-size: 14px; opacity: 0.85;">Đang tải ứng dụng...</p>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-indicator');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
